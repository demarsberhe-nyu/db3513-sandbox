services:
  - type: web
    name: the-shortlist
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 26.13.0
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEPLOY
        value: "true"
      # Render asks for this value when the service is created. It never goes in Git.
      - key: TMDB_API_TOKEN
        sync: false
