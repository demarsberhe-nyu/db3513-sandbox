<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Shortlist</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <p class="eyebrow">Setup</p>
    <h1>The Shortlist</h1>
    <p class="tagline">Three movies, on the services you already pay for.</p>

    <p class="mode" id="mode" aria-live="polite"></p>
    <div id="people"></div>
  </main>

  <template id="upload-template">
    <section class="person">
      <h2 data-field="heading"></h2>
      <form>
        <label>
          Name
          <input type="text" name="name" maxlength="40" autocomplete="off" required />
        </label>
        <label>
          Letterboxd export (the ZIP, or ratings, watched and watchlist CSVs)
          <input type="file" name="files" accept=".zip,.csv" multiple required />
        </label>
        <p class="error" role="alert" data-field="error" hidden></p>
        <button type="submit">Add</button>
      </form>
    </section>
  </template>

  <template id="profile-template">
    <section class="person">
      <div class="person-header">
        <h2 data-field="heading"></h2>
        <button type="button" class="quiet" data-field="remove">Remove</button>
      </div>
      <dl class="counts">
        <div><dt>Watchlist</dt><dd data-field="watchlist"></dd></div>
        <div><dt>Watched</dt><dd data-field="watched"></dd></div>
        <div><dt>Rated</dt><dd data-field="rated"></dd></div>
      </dl>
      <h3>Top-rated films</h3>
      <ol class="films" data-field="films"></ol>
      <p class="more" data-field="more" hidden></p>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
